[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quanta-app"
version = "0.1.0"
description = "quanta-one CLI: FRC robot data analysis and plotting"
requires-python = ">=3.10"
dependencies = [
    "quanta-io",
    "quanta-analysis",
    "quanta-plot",
    "nicegui>=1.4",
]

[project.scripts]
quanta = "quanta_app.main:run"

[tool.uv.sources]
quanta-io = { workspace = true }
quanta-analysis = { workspace = true }
quanta-plot = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/quanta_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quanta-plot"
version = "0.1.0"
description = "Matplotlib-based plotting for FRC robot data analysis"
requires-python = ">=3.10"
dependencies = [
    "pykit-core",
    "quanta-analysis",
    "matplotlib>=3.8",
]

[tool.uv.sources]
pykit-core = { workspace = true }
quanta-analysis = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/quanta_plot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
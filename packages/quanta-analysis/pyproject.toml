[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quanta-analysis"
version = "0.1.0"
description = "Signal analysis for FRC robot data"
requires-python = ">=3.13"
dependencies = [
    "pykit-core",
    "quanta-io",
    "numpy>=1.26",
    "pandas>=2.0",
]

[tool.uv.sources]
pykit-core = { workspace = true }
quanta-io = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/quanta_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]